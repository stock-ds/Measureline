plugins {
    id 'com.android.application' version '9.0.1'
}

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.beatsportable.beats'
    compileSdk 34

    defaultConfig {
        // Play Store identity. Java packages stay com.beatsportable.beats.
        applicationId 'com.stockds.pocketarrows'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 24
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    useLibrary 'org.apache.http.legacy'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            resources.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            // Intentionally do NOT package libs/ as jniLibs: the only native lib is
            // Immersion TouchSense (libImmEmulatorJ.so), which ships only for the
            // deprecated 'armeabi' and 'x86' ABIs. Bundling it makes the APK declare
            // native-code and become ABI-specific, so it fails to install on modern
            // arm64-only devices ("app not compatible"). The haptics feature is
            // optional and GUIVibrator already falls back to the system Vibrator when
            // the library is absent (catch Throwable around the Launcher init).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

base {
    archivesName = 'PocketArrows'
}

dependencies {
    implementation files('libs/UHL.jar')
}
